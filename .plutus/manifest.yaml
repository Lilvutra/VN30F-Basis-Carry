schema_version: "2.0"

repo:
  name: project5-hypothesis
  primary_language: python

env:
  base: python
  python_version: "3.10"
  requirements_file: requirements.txt
  os_packages: []

# DB-backed (Tier 3): credentials injected as env vars into the data_collection
# steps. No secrets are committed. Every id in used_by must exist in steps[].id.
secrets:
  - key: HOST
    purpose: Database host
    used_by: [futures, membership, basket, intraday_check, capacity, walkforward_intraday]
  - key: PORT
    purpose: Database port
    used_by: [futures, membership, basket, intraday_check, capacity, walkforward_intraday]
  - key: DATABASE
    purpose: Database name
    used_by: [futures, membership, basket, intraday_check, capacity, walkforward_intraday]
  - key: USER_DB
    purpose: Database user
    used_by: [futures, membership, basket, intraday_check, capacity, walkforward_intraday]
  - key: PASSWORD
    purpose: Database password
    used_by: [futures, membership, basket, intraday_check, capacity, walkforward_intraday]

data_sources:
  raw: []
  processed: []

steps:
  - id: futures
    nine_step: step_2_data_collection
    required: true
    label: "Download the continuous VN30F front-month series + VN30 index, incl. 09:15 opens"
    command: "python scripts/download_data.py --query-file sql/vn30f_frontmonth.sql --output data/raw/vn30f_frontmonth.parquet"
    network: bridge
    verification_mode: execute
    timeout_seconds: 1800
    inputs: []
    outputs:
      - data/raw/vn30f_frontmonth.parquet
    depends_on: []

  - id: membership
    nine_step: step_2_data_collection
    required: true
    label: "Download VN30 membership snapshots for the hedge basket"
    command: "python scripts/download_data.py --query-file sql/vn30_membership.sql --output data/raw/vn30_membership.parquet"
    network: bridge
    verification_mode: execute
    timeout_seconds: 600
    inputs: []
    outputs:
      - data/raw/vn30_membership.parquet
    depends_on: []

  - id: basket
    nine_step: step_2_data_collection
    required: true
    label: "Download adjusted + raw close and volume for every VN30 member ever, VN30 and E1VFVN30"
    command: "python scripts/download_data.py --query-file sql/basket_prices.sql --output data/raw/vn30_basket_prices.parquet"
    network: bridge
    verification_mode: execute
    timeout_seconds: 1800
    inputs: []
    outputs:
      - data/raw/vn30_basket_prices.parquet
    depends_on: []

  - id: backtest
    nine_step: step_4_in_sample
    required: true
    label: "Basis backtest: long VN30 basket / short VN30F1M, with costs, T+2 and margin sim"
    command: "python scripts/basis_backtest.py --futures data/raw/vn30f_frontmonth.parquet --basket data/raw/vn30_basket_prices.parquet --membership data/raw/vn30_membership.parquet --outdir result/basis"
    network: none
    verification_mode: execute
    timeout_seconds: 1800
    inputs:
      - data/raw/vn30f_frontmonth.parquet
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
    outputs:
      - result/basis/trades.csv
      - result/basis/summary.csv
      - result/basis/cost_curve.csv
      - result/basis/FINDINGS.md
    depends_on: [futures, membership, basket]

  - id: backtest_fit
    nine_step: step_4_in_sample
    required: true
    label: "Same backtest with a regressed-weight (fit) hedge basket"
    command: "python scripts/basis_backtest.py --futures data/raw/vn30f_frontmonth.parquet --basket data/raw/vn30_basket_prices.parquet --membership data/raw/vn30_membership.parquet --basket-mode fit --outdir result/basis_fit"
    network: none
    verification_mode: execute
    timeout_seconds: 1800
    inputs:
      - data/raw/vn30f_frontmonth.parquet
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
    outputs:
      - result/basis_fit/trades.csv
      - result/basis_fit/FINDINGS.md
    depends_on: [futures, membership, basket]

  - id: tracking
    nine_step: step_3_data_processing
    required: true
    label: "Tracking gap of equal / fit / ETF hedge baskets vs VN30 over every 5-session window"
    command: "python scripts/tracking_error.py --basket data/raw/vn30_basket_prices.parquet --membership data/raw/vn30_membership.parquet --outdir result/tracking"
    network: none
    verification_mode: execute
    timeout_seconds: 1800
    inputs:
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
    outputs:
      - result/tracking/tracking_error.csv
      - result/tracking/summary.csv
    depends_on: [basket]

  - id: walkforward
    nine_step: step_5_optimization
    required: true
    label: "Anchored yearly walk-forward + 2025 split over entry × exit × basket grid"
    command: "python scripts/walk_forward.py --futures data/raw/vn30f_frontmonth.parquet --basket data/raw/vn30_basket_prices.parquet --membership data/raw/vn30_membership.parquet --outdir result/walkforward"
    network: none
    verification_mode: execute
    timeout_seconds: 1800
    inputs:
      - data/raw/vn30f_frontmonth.parquet
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
    outputs:
      - result/walkforward/folds.csv
      - result/walkforward/oos_trades.csv
      - result/walkforward/FINDINGS.md
    depends_on: [futures, membership, basket]

  - id: walkforward_cost_nextopen
    nine_step: step_6_out_of_sample
    required: true
    label: "Walk-forward of the cost-relative entry buffer, filled at the next 09:15 open"
    command: "python scripts/walk_forward.py --futures data/raw/vn30f_frontmonth.parquet --basket data/raw/vn30_basket_prices.parquet --membership data/raw/vn30_membership.parquet --entry-rule cost --execution next_open --modes fit --exits 3 --entries=-4,-2,0,2,4,6,8 --outdir result/walkforward_cost_next_open"
    network: none
    verification_mode: execute
    timeout_seconds: 1800
    inputs:
      - data/raw/vn30f_frontmonth.parquet
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
    outputs:
      - result/walkforward_cost_next_open/folds.csv
      - result/walkforward_cost_next_open/FINDINGS.md
    depends_on: [futures, membership, basket]

  - id: intraday_check
    nine_step: step_6_out_of_sample
    required: false
    label: "Intraday step 1: displayed vs capturable (bid/ask) basis at triggers, held to expiry"
    command: "python scripts/intraday_check.py --futures data/raw/vn30f_frontmonth.parquet --basket data/raw/vn30_basket_prices.parquet --membership data/raw/vn30_membership.parquet --outdir result/intraday"
    network: bridge
    verification_mode: execute
    timeout_seconds: 3600
    inputs:
      - data/raw/vn30f_frontmonth.parquet
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
    outputs:
      - data/raw/intraday_basis_minute.parquet
      - result/intraday/events.csv
      - result/intraday/FINDINGS.md
    depends_on: [futures, membership, basket]

  - id: capacity
    nine_step: step_6_out_of_sample
    required: false
    label: "Capacity: partial fills from the top-3 book at each fund buffer-3 trigger, P&L and capital by target size"
    command: "python scripts/capacity.py --events result/intraday_fund_buffer3/events.csv --outdir result/capacity"
    network: bridge
    verification_mode: execute
    timeout_seconds: 3600
    inputs:
      - result/intraday_fund_buffer3/events.csv
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
    outputs:
      - result/capacity/capacity.csv
      - result/capacity/FINDINGS.md
    depends_on: [intraday_check]

  - id: walkforward_intraday
    nine_step: step_6_out_of_sample
    required: false
    label: "Steps 5–6 for the intraday rule: buffer × vol-cap walk-forward, trades held to expiry with tracking and margin"
    command: "python scripts/walk_forward_intraday.py --outdir result/walkforward_intraday"
    network: bridge
    verification_mode: execute
    timeout_seconds: 3600
    inputs:
      - data/raw/vn30f_frontmonth.parquet
      - data/raw/vn30_basket_prices.parquet
      - data/raw/vn30_membership.parquet
      - data/raw/intraday_basis_minute.parquet
    outputs:
      - result/walkforward_intraday/folds.csv
      - result/walkforward_intraday/oos_trades.csv
      - result/walkforward_intraday/FINDINGS.md
    depends_on: [futures, membership, basket]

  - id: figures
    nine_step: step_6_out_of_sample
    required: false
    label: "README figures from data/raw and result/"
    command: "python scripts/make_figures.py"
    network: none
    verification_mode: execute
    timeout_seconds: 600
    inputs:
      - data/raw/vn30f_frontmonth.parquet
      - result/walkforward_intraday/oos_trades.csv
      - result/capacity/fills.csv
    outputs:
      - figures/01_basis_history.png
      - figures/07_oos_trades.png
    depends_on: [walkforward_intraday, capacity, tracking, backtest_fit]

nine_step_coverage:
  step_1_hypothesis:       {present: true,  section: "Step 1 — Hypothesis"}
  step_2_data_collection:  {present: true,  section: "Step 2 — Data collection"}
  step_3_data_processing:  {present: true,  section: "Step 3 — Data processing: the hedge basket"}
  step_4_in_sample:        {present: true,  section: "Step 4 — In-sample backtest"}
  step_5_optimization:     {present: true,  section: "Step 5 — Optimization"}
  step_6_out_of_sample:    {present: true,  section: "Step 6 — Out-of-sample"}
  step_7_paper_trading:    {present: false, section: "Steps 7–9 — not started"}
